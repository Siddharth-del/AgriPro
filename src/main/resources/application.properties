spring.application.name=Smart-Agriculture-system

# ─── Server ───────────────────────────────────────────────────
server.port=${PORT:8080}
server.address=0.0.0.0
spring.main.web-application-type=servlet

# ─── Database ─────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER_NAME}
spring.datasource.password=${DB_PWD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA/Hibernate ────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ─── Connection Pool (HikariCP) ───────────────────────────────
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.data-source-properties.sslmode=require

# ─── ML Service URLs ──────────────────────────────────────────
ml.crop.api.url=http://localhost:5000/api/predict-crop
ml.disease.api.url=http://localhost:5000/api/detect-disease

# ─── Image Upload ─────────────────────────────────────────────
project.image=/tmp/smart-agriculture/images/
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─── Logging (reduced for production) ────────────────────────
logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

# ─── Spring AI ────────────────────────────────────────────────
spring.ai.openai.api-key=${API_KEY}
spring.ai.openai.base-url=${API_URL}
spring.ai.openai.chat.options.model=${API_MDL}

# ─── Security ─────────────────────────────────────────────────
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=3000000
spring.cropp.app.jwtCookies=smartAgricultureSytem

# ─── Email ────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── IoT Device ───────────────────────────────────────────────
iot.device.api.key=${IOT_API_KEY}

# ─── Irrigation ───────────────────────────────────────────────
irrigation.email.cooldown.minutes=10

# ─── Weather ──────────────────────────────────────────────────
weather.api.key=${WEATHER_API_KEY}